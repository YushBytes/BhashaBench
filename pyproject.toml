[project]
name = "bhashabench"
version = "0.1.0"
description = "Automated testing and benchmarking platform for Indian-language voice AI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YushBytes" }]

# Runtime dependencies are declared in backend/requirements.txt so that the
# backend Docker image can be built without copying this file. This section is
# kept intentionally empty to avoid two competing sources of truth.
dependencies = []

# The `bhashabench` command. Installing the project in editable mode
# (`pip install -e .`) puts it on PATH; until then the CLI is reachable as
# `python -m app.cli` from `backend/`, which is how CI and the test suite
# invoke it.
[project.scripts]
bhashabench = "app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# =============================================================================
# Ruff - linting and formatting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

# Ruff's default `include` carries "*.md", so it formats and lints the Python
# code blocks inside Markdown. That turned `ruff format --check .` into a gate
# over documentation: the eleven files in `docs/` counted as eleven "Python"
# files, and editing prose could fail a formatting check with no Python
# touched - which happened. The gate measures this project's Python source, so
# Markdown is dropped here. Everything else is Ruff's default, restated
# because setting `include` replaces it rather than extending it.
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

# `.agents/` and `.claude/` are local agent tooling that lives inside the
# working tree and is not tracked. They contributed 79 files to the formatted
# count, so the figure was a property of one developer's machine rather than
# of the repository.
extend-exclude = [
    ".venv",
    "venv",
    "frontend",
    "__pycache__",
    ".ruff_cache",
    ".agents",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations (enforce type annotations)
    "ASYNC",  # flake8-async
]
ignore = [
    "ANN401",  # allow `typing.Any` where it is genuinely the right type
    "B008",    # FastAPI's `Depends(...)` in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests may omit return annotations on test functions.
"backend/tests/*" = ["ANN201", "ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = ["error"]
