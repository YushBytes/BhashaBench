# Pytest configuration for runs whose rootdir is `backend/` - which in
# practice means inside the Docker container, where docker-compose mounts
# ./backend at /app and the repository root (with its pyproject.toml) is not
# present.
#
# Without this file the in-container run found no configuration at all:
# `filterwarnings = error` was inactive, so a deprecation warning that fails
# the suite on the host passed quietly in the container, and collection was
# unconstrained - it tried to collect `app/models/test_run.py` as a test
# module. A test run that enforces less than the host's is worse than no
# second run, because it reads as corroboration.
#
# The settings below must match `[tool.pytest.ini_options]` in the repository
# root's pyproject.toml, which stays the authority for host runs. Only the two
# path settings differ, because they are relative to different roots.
# `tests/test_tooling.py` asserts the rest stay in step.
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
filterwarnings =
    error
