# =============================================================================
# Alembic configuration
# =============================================================================
# This file lives in `backend/` rather than the repository root so that it is
# present inside the backend Docker image, which copies only `backend/`. Run
# migrations from this directory:
#
#   cd backend && alembic upgrade head
#   docker compose exec backend alembic upgrade head
#
# No database URL is configured here. `env.py` reads it from application
# settings, so the connection string - which contains a password - exists only
# in the environment and never in a committed file.

[alembic]
script_location = alembic

# Migration filenames are prefixed with a UTC timestamp so they sort
# chronologically in a directory listing and in review diffs.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

prepend_sys_path = .

# Fail rather than silently truncate an over-long generated filename.
truncate_slug_length = 60

sqlalchemy.url =

[post_write_hooks]
# Generated migrations are formatted and linted with the project's Ruff
# configuration, so a migration cannot be the one file that fails CI.
hooks = ruff_format,ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --config ../pyproject.toml REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix --config ../pyproject.toml REVISION_SCRIPT_FILENAME

# =============================================================================
# Logging
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# INFO here would echo SQL including bound parameters.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
