# =============================================================================
# BhashaBench - development stack
# =============================================================================
# Usage:
#   cp .env.example .env     (PowerShell: Copy-Item .env.example .env)
#   docker compose up --build
#
# No credentials are hard-coded here. Every secret is read from `.env`, which
# is git-ignored; the `:?` syntax makes Compose fail with a clear message
# rather than silently starting with a default password.

name: bhashabench

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - no schema is created yet; this establishes the service and a
  # durable volume so later phases have somewhere to migrate into.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bhashabench-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Faster startup for a disposable development database.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Exposed on the host so tools such as psql or DBeaver can connect.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      # Context is the repository root so the Dockerfile can copy `backend/`.
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: bhashabench-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Inside the Compose network the database host is the service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount for hot reload. Named volumes shadow the host's caches so
      # Windows-generated bytecode does not leak into the Linux container.
      - ./backend:/app
      - backend_pycache:/app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: bhashabench-frontend
    restart: unless-stopped
    environment:
      # Resolved in the browser, so it must be a host-reachable URL.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep container-built dependencies and the build
      # cache out of the Windows host bind-mount.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: bhashabench-postgres-data
  backend_pycache:
