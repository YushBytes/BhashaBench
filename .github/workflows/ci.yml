# BhashaBench CI foundation (Phase 0; Phase 14 builds on it).
#
# Three independent jobs. No secrets are read and no live provider is called:
# both live suites are opt-in (TRANSCRIPTION_LIVE_TESTS / SPEECH_LIVE_TESTS)
# and stay off, and the providers default to the offline fakes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, alembic, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bhashabench
          POSTGRES_USER: bhashabench
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhashabench -d bhashabench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only what pytest needs. APP_ENV and DATABASE_URL are deliberately NOT set
    # job-wide: the configuration tests assert defaults and would read them.
    env:
      # conftest derives its own bhashabench_test database from this URL.
      BHASHABENCH_TEST_DATABASE_URL: postgresql+psycopg://bhashabench:ci-only-not-a-secret@localhost:5432/bhashabench
      # An unreachable database fails the run instead of skipping ~600 tests.
      BHASHABENCH_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Alembic upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://bhashabench:ci-only-not-a-secret@localhost:5432/bhashabench
        run: python -m alembic upgrade head

      - name: Alembic drift check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://bhashabench:ci-only-not-a-secret@localhost:5432/bhashabench
        run: python -m alembic check

      - name: Pytest (database required)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  compose:
    name: compose (configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Compose refuses to render without the variables it marks required.
      # .env.example holds placeholders only, never a real credential.
      - name: Provide placeholder environment
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
